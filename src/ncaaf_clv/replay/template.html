<meta charset="utf-8">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#eef1ec; --surface:#ffffff; --surface-2:#e3e8e1; --text:#16211a; --muted:#5d6b61; --line:#cfd7cf;
    --accent:#b98b00; --accent-strong:#f2c230; --accent-soft:rgba(242,194,48,.20);
    --bug:#111614; --bug-text:#f4f6f3; --bug-muted:#9aa89f; --bug-line:#2a332d;
    --focus:#2b62e6; --shadow:0 10px 30px rgba(20,40,25,.10);
    --grass-a:#2f7d3b; --grass-b:#2a7236; --fieldline:rgba(255,255,255,.88);
    --los:#2b62e6; --fd:#f2d21e;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1210; --surface:#161c18; --surface-2:#1e2621; --text:#e8ece8; --muted:#98a49c; --line:#2a332d;
      --accent:#f2c230; --accent-strong:#ffd34d; --accent-soft:rgba(242,194,48,.16);
      --bug:#0b0f0d; --bug-text:#f4f6f3; --bug-muted:#8e9a92; --bug-line:#232b26;
      --shadow:0 10px 30px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1210; --surface:#161c18; --surface-2:#1e2621; --text:#e8ece8; --muted:#98a49c; --line:#2a332d;
    --accent:#f2c230; --accent-strong:#ffd34d; --accent-soft:rgba(242,194,48,.16);
    --bug:#0b0f0d; --bug-text:#f4f6f3; --bug-muted:#8e9a92; --bug-line:#232b26;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45;margin:0}
  button,select,input{font-family:inherit}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .app{max-width:1120px;margin:0 auto;padding:22px 16px 56px;display:grid;gap:14px}

  /* masthead */
  .masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:0 2px 4px}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .masthead h1{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-weight:800;font-size:38px;line-height:1;margin:6px 0 0;letter-spacing:.01em;text-wrap:balance}
  .meta{font-size:13px;color:var(--muted);text-align:right;line-height:1.5}
  @media (max-width:640px){.meta{text-align:left}}

  /* score bug: a broadcast element, deliberately dark in both themes */
  .bug{background:var(--bug);color:var(--bug-text);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  .bug-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch}
  .team{display:flex;align-items:center;gap:12px;padding:12px 16px;min-width:0}
  .team.home{flex-direction:row-reverse;text-align:right;box-shadow:inset -7px 0 0 var(--tc)}
  .team.away{box-shadow:inset 7px 0 0 var(--tc)}
  .team img{width:48px;height:48px;object-fit:contain;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .team .name{min-width:0;flex:1}
  .team .abbr{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-weight:700;font-size:26px;letter-spacing:.05em;line-height:1;display:flex;align-items:center;gap:8px}
  .team.home .abbr{justify-content:flex-end}
  .team .full{font-size:12px;color:var(--bug-muted);letter-spacing:.04em;text-transform:uppercase;line-height:1.2;margin-top:4px;text-wrap:balance}
  .team .score{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums;margin-left:auto;min-width:56px;text-align:right}
  .team.home .score{margin-left:0;margin-right:auto;text-align:left}
  .poss{width:16px;height:10px;display:inline-block;opacity:0;transition:opacity .25s}
  .poss.on{opacity:1}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 22px;border-left:1px solid var(--bug-line);border-right:1px solid var(--bug-line);min-width:200px}
  .clock{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .period{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--bug-muted);margin-top:4px}
  .situation{font-size:15px;font-weight:500;margin-top:6px;white-space:nowrap;min-height:1.4em}
  .wprow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:8px 16px 10px;border-top:1px solid var(--bug-line);font-size:12px;color:var(--bug-muted);letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
  .wpbar{height:6px;border-radius:3px;background:var(--away-c);overflow:hidden;position:relative;outline:1px solid rgba(255,255,255,.18)}
  .wpbar i{position:absolute;right:0;top:0;bottom:0;background:var(--home-c);transition:width .5s ease}
  @media (max-width:720px){
    .team{padding:10px 12px;gap:8px}.team img{width:36px;height:36px}.team .full{display:none}.team .score{font-size:36px;min-width:40px}.team .abbr{font-size:20px}
    .center{min-width:0;padding:8px 10px}.clock{font-size:32px}.situation{font-size:13px;white-space:normal;text-align:center}
  }

  /* field */
  .fieldwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 8px;display:grid;gap:6px}
  .drivebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:34px}
  .drivebar .label{display:block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .drivebar .val{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
  .drivebar .right{text-align:right}
  .status{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-weight:700;font-size:26px;letter-spacing:.08em;text-transform:uppercase;text-align:center;line-height:1;padding:4px 10px;border-radius:6px;transition:color .2s}
  .status.big{color:var(--accent);animation:pop .7s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{0%{transform:scale(.7);opacity:.2}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  #field{width:100%;height:auto;display:block}
  #field text{user-select:none}
  .fieldlegend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:2px 4px}
  .fieldlegend span{display:inline-flex;align-items:center;gap:6px}
  .fieldlegend i{display:inline-block;width:18px;height:3px;border-radius:2px}
  @media (max-width:640px){.drivebar{grid-template-columns:1fr;text-align:center}.drivebar .right{text-align:center}.status{font-size:22px}}

  /* play card */
  .playcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px 14px;display:grid;gap:8px}
  .pc-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .pc-type{display:inline-flex;align-items:center;gap:8px;font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-weight:700;font-size:22px;letter-spacing:.03em;line-height:1}
  .pc-type img{width:26px;height:26px;object-fit:contain}
  .pc-when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .pc-text{margin:0;font-size:16px;line-height:1.5;max-width:78ch}
  .pc-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
  .wp{display:inline-flex;align-items:center;gap:8px;color:var(--text)}
  .wp img{width:22px;height:22px;object-fit:contain}
  .wp b{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
  .chip{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .chip.warn{border-color:var(--accent);color:var(--accent)}

  /* transport */
  .transport{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--surface-2);border-radius:12px;padding:10px 14px}
  .btn{font-weight:600;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;line-height:1;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--text);color:var(--bg);border-color:var(--text);min-width:92px;justify-content:center}
  .btn:disabled{opacity:.45;cursor:default}
  .scrub{flex:1;display:flex;align-items:center;gap:10px;min-width:220px}
  .scrub input[type=range]{flex:1;accent-color:var(--accent);min-width:120px}
  .readout{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .qchips{display:flex;gap:6px}
  .qchips .btn{padding:7px 10px;font-size:13px}
  .qchips .btn.on{background:var(--accent-soft);border-color:var(--accent)}
  select.speed{padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px}
  .kbd{font-size:12px;color:var(--muted)}
  .kbd kbd{font-family:inherit;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface)}

  /* lower */
  .lower{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start}
  @media (max-width:820px){.lower{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .panel h2{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;margin:0;padding:12px 16px;border-bottom:1px solid var(--line)}
  .log{max-height:440px;overflow:auto;position:relative}
  .dhead{position:sticky;top:0;z-index:1;background:var(--surface-2);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .dhead b{color:var(--text);display:inline-flex;align-items:center;gap:6px}
  .dhead b i{width:10px;height:10px;border-radius:2px;display:inline-block;background:var(--tc)}
  .row{display:grid;grid-template-columns:52px 1fr;gap:10px;width:100%;text-align:left;padding:7px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:13.5px;line-height:1.35}
  .row:hover{background:var(--surface-2)}
  .row.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .row .t{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:1px}
  .row .dd{font-weight:600;font-size:12.5px;letter-spacing:.02em;color:var(--muted)}
  .row.score .dd{color:var(--accent)}
  .row .tx{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .summary{padding:12px 16px;display:grid;gap:14px}
  table.ls{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  table.ls th,table.ls td{padding:6px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:14px}
  table.ls th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
  table.ls td:first-child,table.ls th:first-child{text-align:left}
  table.ls td.tm{display:flex;align-items:center;gap:8px;font-weight:600}
  table.ls td.tm img{width:22px;height:22px;object-fit:contain}
  table.ls td.tot{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-weight:800;font-size:20px}
  .sp{display:grid;gap:6px}
  .sp button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--text);cursor:pointer;font-size:13px;line-height:1.35}
  .sp button:hover{border-color:var(--muted)}
  .sp .q{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .sp .sc{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sp .desc{display:flex;align-items:center;gap:8px;min-width:0}
  .sp .desc img{width:20px;height:20px;object-fit:contain;flex:none}
  .sp .desc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note{font-size:12.5px;color:var(--muted);line-height:1.5}
  .note b{color:var(--text);font-weight:600}
  @media (prefers-reduced-motion: reduce){.status.big{animation:none}.wpbar i{transition:none}}
</style>

<div class="app">
  <header class="masthead">
    <div>
      <div class="eyebrow">Play-by-play replay · ESPN feed</div>
      <h1 id="title"></h1>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <section class="bug" aria-live="polite" id="bug">
    <div class="bug-row">
      <div class="team away" id="awayBlock">
        <img id="awayLogo" alt="">
        <div class="name">
          <div class="abbr"><span id="awayAbbr"></span><svg class="poss" id="awayPoss" viewBox="0 0 16 10" aria-label="possession"><ellipse cx="8" cy="5" rx="7.5" ry="4.5" fill="#a0522d" stroke="#fff" stroke-width=".6"/><path d="M5 5h6M6.5 3.8v2.4M8 3.8v2.4M9.5 3.8v2.4" stroke="#fff" stroke-width=".7"/></svg></div>
          <div class="full" id="awayFull"></div>
        </div>
        <div class="score" id="awayScore">0</div>
      </div>
      <div class="center">
        <div class="clock" id="clock">15:00</div>
        <div class="period" id="period">1st quarter</div>
        <div class="situation" id="situation">Kickoff</div>
      </div>
      <div class="team home" id="homeBlock">
        <img id="homeLogo" alt="">
        <div class="name">
          <div class="abbr"><svg class="poss" id="homePoss" viewBox="0 0 16 10" aria-label="possession"><ellipse cx="8" cy="5" rx="7.5" ry="4.5" fill="#a0522d" stroke="#fff" stroke-width=".6"/><path d="M5 5h6M6.5 3.8v2.4M8 3.8v2.4M9.5 3.8v2.4" stroke="#fff" stroke-width=".7"/></svg><span id="homeAbbr"></span></div>
          <div class="full" id="homeFull"></div>
        </div>
        <div class="score" id="homeScore">0</div>
      </div>
    </div>
    <div class="wprow">
      <span id="wpAway"></span>
      <div class="wpbar" aria-hidden="true"><i id="wpFill" style="width:50%"></i></div>
      <span id="wpHome"></span>
    </div>
  </section>

  <section class="fieldwrap">
    <div class="drivebar">
      <div><span class="label">Current drive</span><span class="val" id="driveInfo">—</span></div>
      <div class="status" id="status">Kickoff</div>
      <div class="right"><span class="label">Play</span><span class="val" id="playPos"></span></div>
    </div>
    <svg id="field" viewBox="0 0 1240 480" role="img" aria-label="Football field with the current ball position"></svg>
    <div class="fieldlegend">
      <span><i style="background:var(--los)"></i>Line of scrimmage</span>
      <span><i style="background:var(--fd)"></i>First-down line</span>
      <span><i style="background:#fff;outline:1px solid var(--line)"></i>Drive so far</span>
      <span><i style="background:repeating-linear-gradient(90deg,#fff 0 4px,transparent 4px 7px);outline:1px solid var(--line)"></i>This play</span>
    </div>
  </section>

  <section class="playcard">
    <div class="pc-head">
      <span class="pc-type"><img id="pcLogo" alt=""><span id="pcType">Kickoff</span></span>
      <span class="pc-when" id="pcWhen"></span>
    </div>
    <p class="pc-text" id="pcText"></p>
    <div class="pc-foot">
      <span id="pcDD"></span>
      <span class="wp">Win %: <img id="wpLogo" alt=""><b id="wpVal"></b></span>
    </div>
  </section>

  <section class="transport" aria-label="Playback controls">
    <button class="btn" id="btnPrev" title="Previous play (←)">◀ Prev</button>
    <button class="btn primary" id="btnPlay" title="Play / pause (space)">▶ Play</button>
    <button class="btn" id="btnNext" title="Next play (→)">Next ▶</button>
    <div class="scrub">
      <input type="range" id="scrub" min="0" max="1" value="0" step="1" aria-label="Scrub through plays">
      <span class="readout" id="readout"></span>
    </div>
    <label class="readout">Speed <select class="speed" id="speed" aria-label="Playback speed">
      <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
    </select></label>
    <div class="qchips" id="qchips"></div>
    <span class="kbd"><kbd>space</kbd> play · <kbd>←</kbd><kbd>→</kbd> step</span>
  </section>

  <section class="lower">
    <div class="panel">
      <h2>Drive log</h2>
      <div class="log" id="log"></div>
    </div>
    <aside class="panel">
      <h2>Game summary</h2>
      <div class="summary">
        <table class="ls" id="linescore"></table>
        <div class="sp" id="scoring"></div>
        <div class="note" id="note"></div>
      </div>
    </aside>
  </section>
</div>

<script>
const D = __DATA__;
(() => {
  const T = D.teams, P = D.plays, DR = D.drives, G = D.game;
  const HOME = G.home, AWAY = G.away;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const HOLD = new Set(['Timeout', 'End Period', 'End of Game']);
  const NOSCRIM = new Set(['Timeout', 'End Period', 'End of Game', 'Kickoff', 'Punt', 'Punt Return', 'Penalty']);
  const isTD = p => p.sc && /Touchdown/.test(p.type);
  const isFG = p => /Field Goal/.test(p.type);
  const isKick = p => /Kickoff|Punt|Field Goal/.test(p.type);
  const secs = c => { const m = /^(\d+):(\d\d)$/.exec(c || ''); return m ? +m[1] * 60 + +m[2] : 0; };
  const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const ord = d => ['', '1st', '2nd', '3rd', '4th'][d] || d;
  const perName = n => ['', '1st', '2nd', '3rd', '4th'][n] || (n + 'th');
  const teamOf = id => T[id] || T[HOME];
  const spot = v => v === 50 ? '50' : v < 50 ? `${T[HOME].abbr} ${v}` : `${T[AWAY].abbr} ${100 - v}`;
  const toGoal = (t, v) => t === HOME ? 100 - v : v;
  const fdLine = (t, v, d) => t === HOME ? v + d : v - d;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  /* ---------- team chrome ---------- */
  const home = T[HOME], away = T[AWAY];
  document.documentElement.style.setProperty('--home-c', '#' + home.color);
  document.documentElement.style.setProperty('--away-c', '#' + away.color);
  $('awayBlock').style.setProperty('--tc', '#' + away.color);
  $('homeBlock').style.setProperty('--tc', '#' + home.color);
  $('awayLogo').src = away.logo; $('homeLogo').src = home.logo;
  $('awayAbbr').textContent = away.abbr; $('homeAbbr').textContent = home.abbr;
  $('awayFull').textContent = away.name; $('homeFull').textContent = home.name;
  $('title').textContent = D.title;
  const metaLines = [
    [G.date, G.week ? 'Week ' + G.week : ''].filter(Boolean).join(' · '),
    [G.venue, G.city, G.state].filter(Boolean).join(', '),
    G.attendance ? 'Attendance ' + Number(G.attendance).toLocaleString() : '',
  ].filter(Boolean);
  $('meta').innerHTML = metaLines.map(esc).join('<br>');

  /* ---------- field ---------- */
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a, parent) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (parent) parent.appendChild(e); return e; };
  const FX0 = 20, FY0 = 30, FY1 = 450, FY = 240;
  const X = v => FX0 + (110 - v) * 10;   // v: 0 = home goal line (right), 100 = away goal line (left)
  const svg = $('field');
  const defs = el('defs', {}, svg);
  const clip = el('clipPath', { id: 'pinClip' }, defs);
  el('circle', { cx: 0, cy: -44, r: 23 }, clip);
  const gGrass = el('g', {}, svg);
  for (let i = 0; i < 10; i++) el('rect', { x: X(100 - i * 10), y: FY0, width: 100, height: FY1 - FY0, fill: i % 2 ? 'var(--grass-b)' : 'var(--grass-a)' }, gGrass);
  // end zones: away on the left, home on the right
  const ezL = el('g', {}, svg), ezR = el('g', {}, svg);
  el('rect', { x: X(110), y: FY0, width: 100, height: FY1 - FY0, fill: '#' + away.color }, ezL);
  el('rect', { x: X(0), y: FY0, width: 100, height: FY1 - FY0, fill: '#' + home.color }, ezR);
  // end zone dressing: the team logo at the top, the school name rotated along the rest of the zone;
  // the zone is 100 units wide, centred on X(105) (away, left) and X(-5) (home, right)
  const EZ_LOGO = 64, EZ_PAD = 14;
  const ezDress = (g, cx, rot, team) => {
    el('image', { href: team.logo, x: cx - EZ_LOGO / 2, y: FY0 + EZ_PAD, width: EZ_LOGO, height: EZ_LOGO }, g);
    const top = FY0 + EZ_PAD + EZ_LOGO + 10, bottom = FY1 - EZ_PAD, txt = team.location.toUpperCase();
    const spacing = 4, size = Math.min(56, Math.floor((bottom - top - (txt.length - 1) * spacing) / (txt.length * 0.52)));
    const t = el('text', { x: 0, y: 0, fill: '#' + (team.alt || 'ffffff'), 'text-anchor': 'middle', 'dominant-baseline': 'central',
      transform: `translate(${cx} ${(top + bottom) / 2}) rotate(${rot})`,
      'font-family': "'Barlow Condensed','Arial Narrow',Impact,sans-serif", 'font-weight': 800, 'font-size': size, 'letter-spacing': spacing }, g);
    t.textContent = txt;
  };
  ezDress(ezL, X(105), -90, away);
  ezDress(ezR, X(-5), 90, home);
  // midfield logo (home team)
  el('image', { href: home.logo, x: X(50) - 70, y: FY - 70, width: 140, height: 140, opacity: .92 }, svg);
  // yard lines, hashes, numbers
  const gLines = el('g', { stroke: 'var(--fieldline)' }, svg);
  for (let v = 0; v <= 100; v += 5) el('line', { x1: X(v), x2: X(v), y1: FY0, y2: FY1, 'stroke-width': v % 50 === 0 ? 4 : 2 }, gLines);
  const hashY = [FY0, FY0 + (FY1 - FY0) * .375 - 5, FY0 + (FY1 - FY0) * .625 - 5, FY1 - 10];
  for (let v = 1; v < 100; v++) { if (v % 5 === 0) continue; for (const y of hashY) el('line', { x1: X(v), x2: X(v), y1: y, y2: y + 10, 'stroke-width': 1.5 }, gLines); }
  const gNum = el('g', { fill: '#fff', 'fill-opacity': .9, 'font-family': "'Barlow Condensed','Arial Narrow',Impact,sans-serif", 'font-weight': 700, 'font-size': 40, 'text-anchor': 'middle' }, svg);
  for (let v = 10; v <= 90; v += 10) {
    const n = String(v <= 50 ? v : 100 - v);
    const b = el('text', { x: X(v), y: FY1 - 42 }, gNum); b.textContent = n;
    const t = el('text', { x: 0, y: 0, transform: `translate(${X(v)} ${FY0 + 42}) rotate(180)` }, gNum); t.textContent = n;
  }
  // goal posts
  const post = (x, dir) => { const g = el('g', { stroke: '#f2d21e', 'stroke-width': 6, 'stroke-linecap': 'round', fill: 'none' }, svg);
    el('line', { x1: x, x2: x, y1: FY - 80, y2: FY + 80 }, g); el('line', { x1: x, x2: x + dir * 14, y1: FY, y2: FY }, g); };
  post(12, 1); post(1228, -1);
  // markers
  const losL = el('line', { y1: FY0, y2: FY1, stroke: 'var(--los)', 'stroke-width': 3, opacity: .95 }, svg);
  const fdL = el('line', { y1: FY0, y2: FY1, stroke: 'var(--fd)', 'stroke-width': 3, opacity: .95 }, svg);
  const gDrive = el('g', { 'stroke-linecap': 'round' }, svg);
  const solidHalo = el('line', { y1: FY, y2: FY, stroke: 'rgba(0,0,0,.45)', 'stroke-width': 8 }, gDrive);
  const solid = el('line', { y1: FY, y2: FY, stroke: '#fff', 'stroke-width': 4 }, gDrive);
  const dashHalo = el('line', { y1: FY, y2: FY, stroke: 'rgba(0,0,0,.45)', 'stroke-width': 8 }, gDrive);
  const dash = el('line', { y1: FY, y2: FY, stroke: '#fff', 'stroke-width': 4, 'stroke-dasharray': '9 8' }, gDrive);
  const arrow = el('polygon', { fill: '#fff', stroke: 'rgba(0,0,0,.45)', 'stroke-width': 1.5 }, gDrive);
  const shadow = el('ellipse', { cx: 0, cy: FY, rx: 16, ry: 5, fill: 'rgba(0,0,0,.35)' }, svg);
  const ball = el('g', {}, svg);
  const pin = el('path', { d: 'M0,0 L-13,-22 A26,26 0 1 1 13,-22 Z', fill: '#fff', stroke: '#333', 'stroke-width': 3, 'stroke-linejoin': 'round' }, ball);
  const pinLogo = el('image', { x: -20, y: -64, width: 40, height: 40, 'clip-path': 'url(#pinClip)' }, ball);

  /* ---------- helpers on plays ---------- */
  const driveStart = {};   // drive n -> yard line where the first scrimmage play started
  for (const p of P) if (!(p.drv in driveStart) && p.type !== 'Kickoff' && !HOLD.has(p.type)) driveStart[p.drv] = p.s;
  const target = p => isTD(p) ? (p.off === HOME ? 105 : -5) : isFG(p) ? (p.off === HOME ? 111 : -11) : p.e;
  const preLabel = p => {
    if (p.type === 'Kickoff') return 'Kickoff';
    if (/Punt/.test(p.type)) return 'Punt';
    if (isFG(p)) return 'Field goal attempt';
    if (/Pass|Interception|Sack/.test(p.type)) return 'Pass';
    if (/Rush|Fumble/.test(p.type)) return /kneel/i.test(p.txt) ? 'Kneel down' : 'Rush';
    return resultLabel(p);
  };
  const resultLabel = p => {
    const t = p.type, x = p.txt;
    if (t === 'Timeout') { const m = /Timeout ([A-Za-z .&'-]+?),/.exec(x); return 'Timeout' + (m ? ' · ' + m[1] : ''); }
    if (t === 'End Period') return p.per === 2 ? 'Halftime' : `End of ${perName(p.per)} quarter`;
    if (t === 'End of Game') return 'Final';
    if (isTD(p)) return 'Touchdown';
    if (t === 'Field Goal Good') return 'Field goal is good';
    if (/Field Goal/.test(t)) return 'Field goal no good';
    if (t === 'Interception') return 'Interception';
    if (t === 'Fumble Recovery (Opponent)') return 'Fumble · turnover';
    if (t === 'Fumble Recovery (Own)') return 'Fumble · recovered';
    if (t === 'Sack') return 'Sack';
    if (t === 'Penalty') { const m = /PENALTY\s+([A-Z]{2,5})\s+([A-Za-z ]+?)(?:\s*\(|\s+\d|,|$)/.exec(x); return m ? `Penalty · ${m[1]} ${m[2].trim()}` : 'Penalty'; }
    if (t === 'Pass Incompletion') return 'Incomplete';
    if (t === 'Kickoff') return /touchback/i.test(x) ? 'Touchback' : 'Kickoff';
    if (/Punt/.test(t)) return /fair catch/i.test(x) ? 'Punt · fair catch' : 'Punt';
    if (/1ST DOWN/.test(x)) return 'First down';
    if (/kneel/i.test(x)) return 'Kneel down';
    if (t === 'Pass Reception') return 'Complete';
    return t;
  };
  const isBig = p => p.sc || p.to || isFG(p);
  const situationPre = (i) => {
    const p = P[i];
    if (HOLD.has(p.type)) return i > 0 ? situationPost(i - 1) : '';
    if (p.type === 'Kickoff') return 'Kickoff';
    if (p.d0 >= 1 && p.d0 <= 4) { const g = p.dist0 >= toGoal(p.pos0, p.s); return `${ord(p.d0)} & ${g ? 'Goal' : p.dist0} at ${spot(p.s)}`; }
    return '';
  };
  const situationPost = (i) => {
    const p = P[i];
    if (p.type === 'End of Game') return 'Final';
    if (HOLD.has(p.type)) return i > 0 ? situationPost(i - 1) : '';
    if (isTD(p)) { const pat = /kick attempt good/i.test(p.txt) ? 'PAT good' : /kick attempt/i.test(p.txt) ? 'PAT no good' : /2pt|two.point/i.test(p.txt) ? '2-pt attempt' : ''; return 'Touchdown' + (pat ? ' · ' + pat : ''); }
    if (isFG(p)) return resultLabel(p);
    if (p.dd) return p.dd;
    if (p.d1 >= 1 && p.d1 <= 4) { const g = p.dist1 >= toGoal(p.pos1, p.e); return `${ord(p.d1)} & ${g ? 'Goal' : p.dist1} at ${spot(p.e)}`; }
    return resultLabel(p);
  };
  const scoreBefore = i => i > 0 ? [P[i - 1].as, P[i - 1].hs] : [0, 0];
  const clockBefore = i => { const p = P[i]; if (p.snap) return secs(p.snap); if (i > 0 && P[i - 1].per === p.per) return secs(P[i - 1].clk); return 900; };
  const wpBefore = i => i > 0 ? P[i - 1].wp : D.pregameWp;

  /* ---------- renderers ---------- */
  const setBall = (v, lift, team) => {
    const x = X(v);
    ball.setAttribute('transform', `translate(${x} ${FY - lift})`);
    shadow.setAttribute('cx', x); shadow.setAttribute('rx', 16 + lift * .12); shadow.setAttribute('opacity', 1 - lift / 300);
    if (team) { const t = teamOf(team); pin.setAttribute('stroke', '#' + t.color); pinLogo.setAttribute('href', t.logo); }
  };
  const setLines = (t, v, dist, down, show) => {
    if (!show || !(down >= 1 && down <= 4)) { losL.setAttribute('opacity', 0); fdL.setAttribute('opacity', 0); return; }
    losL.setAttribute('opacity', .95); losL.setAttribute('x1', X(v)); losL.setAttribute('x2', X(v));
    const f = fdLine(t, v, dist);
    if (f <= 0 || f >= 100 || dist <= 0) { fdL.setAttribute('opacity', 0); return; }
    fdL.setAttribute('opacity', .95); fdL.setAttribute('x1', X(f)); fdL.setAttribute('x2', X(f));
  };
  const setDrive = (p, vBall) => {
    const c = '#' + teamOf(p.pos0).color;
    solid.setAttribute('stroke', c); dash.setAttribute('stroke', c); arrow.setAttribute('fill', c);
    const ds = driveStart[p.drv];
    const showSolid = p.type !== 'Kickoff' && ds !== undefined;
    const x0 = X(ds ?? p.s), x1 = X(p.s), x2 = X(clamp(vBall, -10, 110));
    for (const l of [solidHalo, solid]) { l.setAttribute('x1', x0); l.setAttribute('x2', x1); l.setAttribute('opacity', showSolid ? 1 : 0); }
    for (const l of [dashHalo, dash]) { l.setAttribute('x1', x1); l.setAttribute('x2', x2); l.setAttribute('opacity', Math.abs(x2 - x1) > 2 ? 1 : 0); }
    const dir = Math.abs(x2 - x1) > 2 ? Math.sign(x2 - x1) : (p.pos0 === HOME ? -1 : 1);
    const tip = x2 + dir * 10;
    arrow.setAttribute('points', `${tip},${FY} ${tip - dir * 12},${FY - 7} ${tip - dir * 12},${FY + 7}`);
  };
  const setScore = (a, h) => { $('awayScore').textContent = a; $('homeScore').textContent = h; };
  const setPoss = t => { $('awayPoss').classList.toggle('on', t === AWAY); $('homePoss').classList.toggle('on', t === HOME); };
  const setPeriod = (p, post) => {
    const per = $('period');
    if (post && p.type === 'End of Game') per.textContent = 'Final';
    else if (post && p.type === 'End Period' && p.per === 2) per.textContent = 'Halftime';
    else per.textContent = `${perName(p.per)} quarter`;
  };
  const setWp = wp => {
    const hp = Math.round(wp * 1000) / 10, ap = Math.round((1 - wp) * 1000) / 10;
    $('wpFill').style.width = hp + '%';
    $('wpHome').textContent = `${home.abbr} ${hp.toFixed(1)}%`; $('wpAway').textContent = `${away.abbr} ${ap.toFixed(1)}%`;
    const lead = wp >= .5 ? home : away;
    $('wpLogo').src = lead.logo; $('wpVal').textContent = (wp >= .5 ? hp : ap).toFixed(1);
  };
  const setStatus = (txt, big) => { const s = $('status'); s.classList.remove('big'); void s.offsetWidth; s.textContent = txt; if (big) s.classList.add('big'); };
  const driveInfo = (i, vBall) => {
    const p = P[i], d = DR.find(x => x.n === p.drv);
    if (!d) return '—';
    if (p.type === 'Kickoff') return `Kickoff · ${teamOf(p.off).abbr} to receive`;
    const team = teamOf(d.team);
    let n = 0; for (let k = 0; k <= i; k++) if (P[k].drv === p.drv && !NOSCRIM.has(P[k].type)) n++;
    const ds = driveStart[p.drv] ?? d.start;
    const vv = clamp(vBall, 0, 100);
    const yds = d.team === HOME ? vv - ds : ds - vv;
    const elapsed = Math.max(0, secs(d.startClk) - secs(p.clk) + 900 * (p.per - d.startPer));
    return `${team.abbr} · ${n} play${n === 1 ? '' : 's'}, ${yds} yd${Math.abs(yds) === 1 ? '' : 's'}, ${fmt(elapsed)} · started at ${spot(ds)}`;
  };

  const renderPre = i => {
    const p = P[i]; const [a, h] = scoreBefore(i);
    setScore(a, h); $('clock').textContent = fmt(clockBefore(i)); setPeriod(p, false);
    $('situation').textContent = situationPre(i); setPoss(p.pos0);
    setLines(p.pos0, p.s, p.dist0, p.d0, !isKick(p) && !HOLD.has(p.type) || /Punt|Field Goal/.test(p.type));
    setBall(p.s, 0, p.pos0); setDrive(p, p.s);
    setStatus(preLabel(p), false);
    $('driveInfo').textContent = driveInfo(i, p.s);
    setWp(wpBefore(i));
    // play card
    $('pcLogo').src = teamOf(p.off).logo; $('pcType').textContent = p.type;
    $('pcWhen').textContent = `Q${p.per} · ${p.clk}${p.snap ? ' · snapped at ' + p.snap : ''}`;
    $('pcText').textContent = p.txt;
    const chips = [];
    if (p.sc) chips.push('<span class="chip warn">Scoring play</span>');
    if (p.to) chips.push('<span class="chip warn">Turnover</span>');
    if (p.pen) chips.push('<span class="chip">Penalty</span>');
    $('pcDD').innerHTML = `<span>${esc(situationPost(i))}</span> ${chips.join(' ')}`;
  };
  const renderPost = i => {
    const p = P[i];
    setScore(p.as, p.hs); $('clock').textContent = p.clk; setPeriod(p, true);
    $('situation').textContent = situationPost(i); setPoss(p.pos1);
    const nextIsKick = i + 1 < P.length && P[i + 1].type === 'Kickoff';
    setLines(p.pos1, p.e, p.dist1, p.d1, !(isTD(p) || isFG(p) || nextIsKick || p.type === 'End of Game'));
    setBall(target(p), 0, p.pos1 || p.pos0); setDrive(p, target(p));
    setStatus(resultLabel(p), isBig(p));
    $('driveInfo').textContent = driveInfo(i, p.e);
    setWp(p.wp);
  };

  /* ---------- transport ---------- */
  let cur = -1, playing = false, speed = 1, raf = 0, timer = 0, token = 0;
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const scrub = $('scrub'); scrub.max = P.length - 1;
  const goTo = (i, instant) => {
    i = clamp(i, 0, P.length - 1); cur = i; const p = P[i];
    token++; const my = token; cancelAnimationFrame(raf); clearTimeout(timer);
    scrub.value = i; $('readout').textContent = `Play ${i + 1} / ${P.length}`; $('playPos').textContent = `${i + 1} of ${P.length}`;
    markLog(i); markQ(p.per);
    renderPre(i);
    const moves = !HOLD.has(p.type);
    if (instant || reduced || !moves) { renderPost(i); finish(); return; }
    const v0 = p.s, v1 = target(p), kick = isKick(p), still = Math.abs(v1 - v0) < .5;
    const dur = (kick ? 1500 : still ? 650 : 1000) / speed;
    const c0 = clockBefore(i), c1 = secs(p.clk), t0 = performance.now();
    const frame = now => {
      if (my !== token) return;
      const t = Math.min(1, (now - t0) / dur), e = ease(t);
      const v = v0 + (v1 - v0) * e;
      const lift = kick ? 130 * 4 * t * (1 - t) : still ? 14 * 4 * t * (1 - t) : 0;
      setBall(v, lift); setDrive(p, v);
      $('clock').textContent = fmt(c0 + (c1 - c0) * t);
      if (t < 1) raf = requestAnimationFrame(frame); else { renderPost(i); finish(); }
    };
    raf = requestAnimationFrame(frame);
  };
  const finish = () => {
    if (!playing) return;
    if (cur >= P.length - 1) { setPlaying(false); return; }
    const p = P[cur];
    const dwell = (isBig(p) ? 2600 : HOLD.has(p.type) ? 1400 : 1700) / speed;
    timer = setTimeout(() => goTo(cur + 1, false), dwell);
  };
  const setPlaying = on => {
    playing = on; $('btnPlay').textContent = on ? '❚❚ Pause' : '▶ Play';
    clearTimeout(timer);
    if (on) { if (cur >= P.length - 1) goTo(0, true); finish(); }
  };
  $('btnPlay').addEventListener('click', () => setPlaying(!playing));
  $('btnPrev').addEventListener('click', () => { setPlaying(false); goTo(cur - 1, true); });
  $('btnNext').addEventListener('click', () => { setPlaying(false); goTo(cur + 1, false); });
  scrub.addEventListener('input', () => { setPlaying(false); goTo(+scrub.value, true); });
  $('speed').addEventListener('change', e => { speed = +e.target.value; });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); setPlaying(false); goTo(cur + 1, false); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); setPlaying(false); goTo(cur - 1, true); }
    else if (e.key === 'Home') { setPlaying(false); goTo(0, true); }
    else if (e.key === 'End') { setPlaying(false); goTo(P.length - 1, true); }
  });

  /* quarter chips */
  const firstOfPeriod = {}; P.forEach((p, i) => { if (!(p.per in firstOfPeriod)) firstOfPeriod[p.per] = i; });
  const qc = $('qchips');
  for (const q of Object.keys(firstOfPeriod)) {
    const b = document.createElement('button'); b.className = 'btn'; b.textContent = +q > 4 ? 'OT' + (+q - 4) : 'Q' + q; b.dataset.q = q;
    b.addEventListener('click', () => { setPlaying(false); goTo(firstOfPeriod[q], true); });
    qc.appendChild(b);
  }
  const markQ = per => { for (const b of qc.children) b.classList.toggle('on', +b.dataset.q === per); };

  /* ---------- drive log ---------- */
  const log = $('log'); const rows = [];
  let lastDrv = null;
  P.forEach((p, i) => {
    if (p.drv !== lastDrv) {
      lastDrv = p.drv; const d = DR.find(x => x.n === p.drv);
      const h = document.createElement('div'); h.className = 'dhead';
      if (d) {
        h.style.setProperty('--tc', '#' + teamOf(d.team).color);
        h.innerHTML = `<b><i></i>Drive ${d.n} · ${esc(teamOf(d.team).abbr)}</b><span>${esc(d.desc)}</span><span>${esc(d.result)}</span>`;
      } else h.innerHTML = '<b>—</b><span></span><span></span>';
      log.appendChild(h);
    }
    const r = document.createElement('button'); r.className = 'row' + (p.sc ? ' score' : ''); r.dataset.i = i;
    const tag = p.sc ? resultLabel(p) : HOLD.has(p.type) || p.type === 'Kickoff' || p.type === 'Penalty' ? resultLabel(p) : (situationPre(i) || p.type);
    r.innerHTML = `<span class="t">Q${p.per} ${esc(p.clk)}</span><span><span class="dd">${esc(tag)}</span><span class="tx">${esc(p.txt)}</span></span>`;
    r.addEventListener('click', () => { setPlaying(false); goTo(i, false); });
    log.appendChild(r); rows.push(r);
  });
  let curRow = null;
  const markLog = i => {
    if (curRow) curRow.classList.remove('cur');
    curRow = rows[i]; curRow.classList.add('cur');
    const top = curRow.offsetTop - log.clientHeight / 2 + curRow.offsetHeight / 2;
    log.scrollTo({ top, behavior: reduced ? 'auto' : 'smooth' });
  };

  /* ---------- summary ---------- */
  const ls = $('linescore');
  const qs = Math.max(home.line.length, away.line.length);
  const thead = '<tr><th></th>' + Array.from({ length: qs }, (_, k) => `<th>${k + 1 > 4 ? 'OT' + (k - 3) : k + 1}</th>`).join('') + '<th>T</th></tr>';
  const lrow = t => `<tr><td class="tm"><img src="${t.logo}" alt="">${esc(t.abbr)}</td>` + Array.from({ length: qs }, (_, k) => `<td>${t.line[k] ?? ''}</td>`).join('') + `<td class="tot">${t.score}</td></tr>`;
  ls.innerHTML = thead + lrow(away) + lrow(home);
  const sp = $('scoring');
  for (const s of D.scoring) {
    const t = teamOf(s.team); const b = document.createElement('button');
    b.innerHTML = `<span class="q">Q${s.per} ${esc(s.clk)}</span><span class="desc"><img src="${t.logo}" alt=""><span>${esc(s.text)}</span></span><span class="sc">${s.as}–${s.hs}</span>`;
    const idx = P.findIndex(p => p.id === s.id);
    b.addEventListener('click', () => { setPlaying(false); if (idx >= 0) goTo(idx, false); });
    sp.appendChild(b);
  }
  $('note').innerHTML = D.note;

  goTo(0, true);
})();
</script>
